<h1>Post List</h1>

@if (isLoading()) {
  <div class="loading-spinner">Loading posts...</div>
}

@if (errorMsg()) {
  <div class="error-banner">{{ errorMsg() }}</div>
}

<cdk-virtual-scroll-viewport itemSize="60" class="viewport-container">
  @for (post of postList(); track post.id) {
    <div class="item">
      <app-postdetails [post]="post" />
    </div>
  } @empty {
    @if (!isLoading() && !errorMsg()) {
      <div class="empty-state">No posts available.</div>
    }
  }
</cdk-virtual-scroll-viewport>
